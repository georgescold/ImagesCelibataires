<!doctype html>
<!-- Fichier FABRIQUE par gen/faire_web.py a partir de gen/interface.html.
     Ne pas le modifier a la main : la prochaine regeneration effacerait la
     modification. Changer gen/interface.html, ou une regle de faire_web.py. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier carrousels — en ligne</title>
<!-- installable sur l'ecran d'accueil du telephone : voir web/installer.js -->
<link rel="manifest" href="/web/manifest.webmanifest">
<meta name="theme-color" content="#0e0c11">
<link rel="icon" type="image/png" sizes="32x32" href="/web/icones/favicon-32.png">
<link rel="apple-touch-icon" href="/web/icones/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carrousels">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script src="/web/installer.js" defer></script>
<style>
/*
 * Sombre, dense, et surtout lisible.
 * Corps de base a 16 px, jamais en dessous de 14 px, y compris pour les
 * etiquettes : on regarde cet ecran longtemps, ce qu'on y lit doit se lire
 * sans se pencher.
 *
 * Aucune dependance, aucun reseau : pas de CDN, pas de police distante.
 */

:root{
  --fond:#0e0c11;
  --panneau:#191722;
  --panneau-2:#211e2c;
  --panneau-3:#2a2637;
  --bord:#332f3f;
  --bord-vif:#463f55;
  --texte:#f0ecf2;
  --doux:#a9a2b4;
  --accent:#e5385f;
  --accent-clair:#ff6b8c;
  --ok:#35c07a;
  --attention:#e5a13c;
  --erreur:#ff8a76;
  --accent-sourd:#8f2740;
  --rose-voile:rgba(229,56,95,.14);
  --r:12px;
  --r-grand:16px;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:dark}

body{
  margin:0; min-height:100vh; overflow-x:hidden;
  -webkit-text-size-adjust:100%;
  background:radial-gradient(1400px 700px at 50% -18%, #241b23 0%, var(--fond) 62%);
  color:var(--texte);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2{margin:0;line-height:1.25;letter-spacing:-.01em}
p{margin:0}

/* ----------------------------------------------------------------- entete */
.entete{
  display:flex; gap:20px; align-items:center; justify-content:space-between;
  padding:14px clamp(14px, 4vw, 32px);
  padding-left:max(clamp(14px, 4vw, 32px), env(safe-area-inset-left));
  padding-right:max(clamp(14px, 4vw, 32px), env(safe-area-inset-right));
  border-bottom:1px solid var(--bord);
  background:rgba(14,12,17,.74);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  position:sticky; top:0; z-index:20;
}
.entete h1{font-size:20px; font-weight:800}
.entete .note{font-size:15px; color:var(--doux)}
.solde{
  font-size:15px; font-weight:700; font-variant-numeric:tabular-nums;
  color:var(--accent-clair); background:var(--rose-voile);
  border:1px solid var(--accent-sourd); border-radius:999px;
  padding:3px 12px; white-space:nowrap;
}
.solde.bas{color:#ffc9a0; background:rgba(229,161,60,.14); border-color:#6b4c1a}
.solde.vide{color:var(--erreur); background:rgba(255,138,118,.14); border-color:#7a3128}
.solde.hs{color:var(--doux); background:none; border-color:var(--bord)}

main{
  max-width:1680px; margin:0 auto;
  padding:clamp(16px, 3vw, 26px) clamp(14px, 4vw, 32px)
          calc(60px + env(safe-area-inset-bottom));
}

/* --------------------------------------------------------------- panneaux */
.panneau{
  background:var(--panneau);
  border:1px solid var(--bord);
  border-radius:var(--r-grand);
  padding:clamp(16px, 3vw, 24px) clamp(16px, 3vw, 26px);
  margin-bottom:clamp(16px, 3vw, 26px);
}
.tete-panneau{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:18px}
.tete-panneau h2{font-size:17px; font-weight:800}

.etiquette{
  display:block; font-size:14px; font-weight:700;
  letter-spacing:.05em; text-transform:uppercase;
  color:var(--doux); margin-bottom:8px;
}

.rangee{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end}
.champ{display:flex; flex-direction:column; min-width:0}
.champ.age{width:110px}
.champ.persona{width:260px}
.champ.nom{width:230px}

select,input[type="text"],input[type="number"],input[type="search"]{
  width:100%;
  background:var(--panneau-2); color:var(--texte);
  border:1.5px solid var(--bord); border-radius:10px;
  padding:11px 13px; font:inherit; font-size:16px;
}
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-color:var(--accent);
}

/* --------------------------------------------------------------- boutons */
.bouton{
  font:inherit; font-size:16px; font-weight:700;
  color:var(--texte); background:var(--panneau-2);
  border:1.5px solid var(--bord); border-radius:10px;
  padding:11px 18px; cursor:pointer;
  transition:border-color .15s, background .15s, filter .15s;
  text-decoration:none; display:inline-block; text-align:center;
}
.bouton:hover:not(:disabled){border-color:var(--bord-vif); background:var(--panneau-3)}
.bouton:disabled{opacity:.45; cursor:not-allowed}
.bouton.primaire{
  background:linear-gradient(180deg,var(--accent-clair),var(--accent));
  border-color:transparent; color:#2b060f;
}
.bouton.primaire:hover:not(:disabled){filter:brightness(1.08)}
.bouton.telecharge{
  background:var(--rose-voile);
  border-color:var(--accent-sourd);
  color:var(--accent-clair);
}
.bouton.telecharge:hover:not(:disabled){
  background:rgba(229,56,95,.24);
  border-color:var(--accent);
  color:#ffd3dd;
}
.bouton.minuscule{padding:7px 12px; font-size:14px}

@keyframes tourne{to{transform:rotate(360deg)}}
.bouton.travaille{color:transparent; pointer-events:none; position:relative}
.bouton.telecharge.travaille::after, .bouton.plus.travaille::after{border-color:var(--accent-clair); border-top-color:transparent}
.bouton.travaille::after{
  content:''; position:absolute; inset:0; margin:auto;
  width:16px; height:16px; border-radius:50%;
  border:2px solid #2b060f; border-top-color:transparent;
  animation:tourne 700ms linear infinite;
}

#erreur{margin-top:14px; color:var(--erreur); font-size:15px; white-space:pre-wrap}

/* ------------------------------------------------- generations en cours
   Toutes les generations, d'ou qu'elles viennent : lancee sur le telephone,
   elle apparait ici sur l'iPad, avec son avancement. */
.gen{padding:14px 0; border-top:1px solid var(--bord)}
.gen:first-child{border-top:0; padding-top:0}
.gen:last-child{padding-bottom:0}
.gen-tete{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.gen-titre{font-weight:800; font-size:16px; min-width:0; overflow-wrap:anywhere}
.gen-pct{font-weight:800; font-variant-numeric:tabular-nums; color:var(--accent-clair); white-space:nowrap}
.gen.fini .gen-pct{color:var(--ok)}
.gen.erreur .gen-pct{color:var(--erreur)}
.barre-prog{
  height:8px; margin:9px 0 7px; overflow:hidden;
  background:var(--panneau-2); border:1px solid var(--bord); border-radius:999px;
}
.barre-prog > span{
  display:block; height:100%;
  background:linear-gradient(90deg, var(--accent), var(--accent-clair)); border-radius:inherit;
}
.gen.fini .barre-prog > span{background:var(--ok)}
.gen.erreur .barre-prog > span{background:var(--erreur)}
.gen-etape{font-size:14px; color:var(--doux); overflow-wrap:anywhere}
.gen.erreur .gen-etape{color:var(--erreur)}
.gen details{margin-top:4px}
.gen summary{cursor:pointer; font-size:14px; color:var(--doux); min-height:36px; display:flex; align-items:center}
.gen pre{
  margin:4px 0 0; padding:10px 12px; max-height:200px; overflow:auto;
  background:var(--panneau-2); border:1px solid var(--bord); border-radius:var(--r);
  font:13px/1.65 ui-monospace,'Cascadia Mono',Consolas,monospace; color:var(--doux); white-space:pre-wrap;
}

/* -------------------------------------------------------------- librairie */
.barre{display:flex; gap:14px; align-items:center; margin-bottom:18px; flex-wrap:wrap}
.onglets{display:flex; gap:8px; background:var(--panneau-2); border:1px solid var(--bord);
 border-radius:12px; padding:4px}
.onglet{
  font:inherit; font-size:15px; font-weight:700; color:var(--doux);
  background:none; border:0; border-radius:9px; padding:8px 16px; cursor:pointer;
}
.onglet.actif{background:var(--accent); color:#2b060f}
.onglet .nb{margin-left:6px; font-weight:600; opacity:.72; font-variant-numeric:tabular-nums}
/* le bouton de déconnexion n'existe qu'en ligne (ajouté par faire_web.py) ;
   son libellé court ne sert que sur téléphone */
.sortir-court{display:none}
.onglet:hover:not(.actif){color:var(--texte)}
.bouton.archive{border-color:var(--bord); color:var(--doux)}
.bouton.supprime{border-color:var(--bord); color:var(--doux)}
.bouton.supprime:hover:not(:disabled){border-color:var(--erreur); color:var(--erreur)}

/* l'etoile : creuse quand la femme n'est pas en favori, pleine et doree sinon */
.bouton.etoile{
  border-color:var(--bord); color:var(--doux);
  font-size:17px; line-height:1; padding:7px 11px;
}
.bouton.etoile:hover:not(:disabled){border-color:var(--attention); color:var(--attention)}
.bouton.etoile.aimee{
  color:#ffca5c; border-color:#6b4c1a; background:rgba(229,161,60,.14);
}
.bouton.plus{
  background:var(--rose-voile); border-color:var(--accent-sourd); color:var(--accent-clair);
}
.bouton.plus:hover:not(:disabled){background:rgba(229,56,95,.24); border-color:var(--accent)}

/* avancement de l'ajout de photos, dans la carte de la personne concernee :
   plusieurs extensions peuvent tourner en meme temps, chacune a la sienne */
.extension{
  margin-bottom:14px; padding:11px 13px;
  background:var(--panneau-2); border:1px solid var(--bord); border-radius:var(--r);
  font:13px/1.7 ui-monospace,'Cascadia Mono',Consolas,monospace;
  color:var(--doux); white-space:pre-wrap; max-height:140px; overflow:auto;
}
.extension.rate{color:var(--erreur); border-color:#7a3128}
.puce.genre{color:var(--accent-clair); border-color:var(--accent-sourd); background:var(--rose-voile)}
.champ.genre{width:150px}
.bouton.archive:hover:not(:disabled){border-color:var(--attention); color:var(--attention)}
.barre input[type="search"]{width:280px}

.femme{
  background:var(--panneau); border:1px solid var(--bord);
  border-radius:var(--r-grand); margin-bottom:clamp(14px, 2.5vw, 22px);
  padding:clamp(16px, 3vw, 22px) clamp(14px, 3vw, 24px);
}
.femme-tete{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px}
.femme-tete .nom{font-size:19px; font-weight:800; margin-right:4px}
.puce{
  font-size:14px; color:var(--doux);
  background:var(--panneau-2); border:1px solid var(--bord);
  border-radius:999px; padding:4px 12px; white-space:nowrap;
}
.puce.reconstitue{color:var(--attention); border-color:#4a3c1c}
.femme-tete .etoile{margin-left:auto}
.femme-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center}

.pellicule{display:grid; grid-template-columns:repeat(5,1fr); gap:16px; align-items:stretch}
@media(max-width:1400px){.pellicule{grid-template-columns:repeat(4,1fr)}}
@media(max-width:1100px){.pellicule{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){.pellicule{grid-template-columns:repeat(2,1fr)}}

.vue{display:grid; grid-template-rows:auto 1fr auto; gap:10px}
.cadre{position:relative; line-height:0}
.vue img{
  width:100%; display:block; border-radius:var(--r);
  aspect-ratio:4/5; object-fit:cover;
  background:var(--panneau-2); border:1px solid var(--bord);
  transition:opacity .2s;
}

/* la flèche qui refait cette photo-là : posée sur l'image, discrète jusqu'au
   survol, mais toujours visible au doigt — sur mobile il n'y a pas de survol */
.refaire{
  position:absolute; top:8px; right:8px;
  width:34px; height:34px; padding:0;
  font:inherit; font-size:17px; line-height:1; font-weight:700;
  color:var(--texte); background:rgba(14,12,17,.72);
  border:1px solid var(--bord-vif); border-radius:50%;
  cursor:pointer; opacity:.35; transition:opacity .15s, background .15s, color .15s;
  -webkit-backdrop-filter:blur(4px);
  backdrop-filter:blur(4px);
}
.vue:hover .refaire, .refaire:focus-visible{opacity:1}
.refaire:hover:not(:disabled){background:var(--accent); color:#2b060f; border-color:transparent}
.refaire:disabled{cursor:not-allowed}
.vue.occupee img{opacity:.35}
.vue.occupee .refaire{opacity:1; color:transparent; pointer-events:none}
.vue.occupee .refaire::after{
  content:''; position:absolute; inset:0; margin:auto;
  width:15px; height:15px; border-radius:50%;
  border:2px solid var(--accent-clair); border-top-color:transparent;
  animation:tourne 700ms linear infinite;
}
.vue.ratee .refaire{opacity:1; color:var(--erreur); border-color:var(--erreur)}
.vue-note{font-size:13px; line-height:1.4; color:var(--erreur); overflow-wrap:anywhere}
.legende{
  background:var(--panneau-2); border:1px solid var(--bord); border-radius:10px;
  padding:11px 13px; font-size:16px; color:var(--texte); display:flex; align-items:center;
}
.vue-actions{display:flex; gap:8px}
.vue-actions>*{flex:1}

.vide{color:var(--doux); text-align:center; padding:56px 0; font-size:16px}

/* --------------------------------------------------------------- annonces
   Le retour d'un geste dont l'effet se passe ailleurs que sous le doigt : des
   photos arrivées dans la galerie, une suppression refusée par le serveur. */
.annonce{
  position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); z-index:40;
  transform:translateX(-50%); width:max-content; max-width:calc(100vw - 32px);
  background:var(--panneau-3); color:var(--texte);
  border:1px solid var(--bord-vif); border-radius:var(--r);
  padding:11px 16px; font-size:15px; line-height:1.45; text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.45);
}
.annonce.erreur{border-color:#7a3128; color:var(--erreur)}

/* --------------------------------------------------- carte de personnalite */
.champ.type{width:300px}
.champ.prenom{width:220px}
.carte-resultat{display:flex; gap:18px; align-items:flex-start; margin-top:18px; flex-wrap:wrap}
.carte-resultat img{
  width:260px; max-width:100%; display:block; border-radius:var(--r);
  aspect-ratio:4/5; object-fit:cover; border:1px solid var(--bord); background:var(--panneau-2);
}
.carte-infos{display:flex; flex-direction:column; gap:10px; min-width:0}
.carte-infos .nom-type{font-size:17px; font-weight:800}

/* ================================================================ mobile ==
 *
 * Trois adaptations, pas seulement des colonnes qui retrecissent.
 *
 * 1. La pellicule devient une bande qui defile horizontalement, calee photo
 *    par photo. Empilee en colonne, un carrousel de 5 photos demanderait
 *    cinq ecrans de defilement vertical pour etre vu en entier.
 * 2. Les champs du formulaire passent en pleine largeur : a 110 px, le
 *    champ d'age se retrouvait seul sur sa ligne, ce qui est pire.
 * 3. Les zones tactiles montent a 44 px, la taille sous laquelle on rate
 *    sa cible au doigt.
 */

/* ---- tablette en portrait et en dessous ---- */
@media (max-width: 860px){
  .entete{gap:6px 10px; flex-wrap:wrap}
  .entete h1{font-size:18px; order:1}
  .entete #solde{order:2}
  .entete #sortir{order:3; margin-left:auto}
  .entete .note{font-size:14px; width:100%; order:4; margin-top:-2px}
  .tete-panneau{flex-direction:column; align-items:flex-start; gap:4px; margin-bottom:14px}
  .barre{gap:10px}
  .barre input[type="search"]{width:100%; order:3}
  .femme-tete{gap:8px}
  .femme-tete .etoile{margin-left:0}
}

/* ---- telephone ---- */
@media (max-width: 640px){
  /* le formulaire : chaque champ sur toute la largeur, bouton en pleine barre */
  .rangee{gap:12px}
  .champ, .champ.age, .champ.persona, .champ.nom, .champ.genre, .champ.type, .champ.prenom{width:100%}
  .carte-resultat img{width:100%}
  .rangee > .bouton.primaire{width:100%}

  /* la pellicule glisse au doigt, une photo a la fois */
  .pellicule{
    display:flex; grid-template-columns:none;
    gap:12px; overflow-x:auto; scroll-snap-type:x mandatory;
    /* les photos filent jusqu'aux bords de l'ecran, pas jusqu'au bord de la carte */
    margin-inline:calc(-1 * clamp(14px, 3vw, 24px));
    padding-inline:clamp(14px, 3vw, 24px);
    padding-bottom:6px;
    scrollbar-width:thin;
  }
  .vue{flex:0 0 78vw; max-width:340px; scroll-snap-align:center}

  .femme-tete .nom{font-size:17px; width:100%; margin-right:0}
  .puce{font-size:13px; padding:3px 10px}
  .legende{font-size:15px; padding:10px 12px}

  /* Les onglets se partagent la largeur en trois parts égales, compteur sous
     le libellé. Côte à côte, « Archivées (0) » ne tenait plus dès le troisième
     onglet : chaque bouton passait sur deux lignes au hasard, 104 px de haut. */
  /* L'en-tête reste collé en haut de l'écran : sur téléphone, chaque ligne y
     coûte en permanence. La ligne des compteurs répète exactement ceux des
     onglets, elle s'efface ; et en ligne, « Se déconnecter » devient « Sortir »
     pour tenir sur la même ligne que le titre et le solde au lieu d'en ouvrir
     une deuxième — l'en-tête passait à 121 px. */
  .entete .note{display:none}
  .sortir-long{display:none}
  .sortir-court{display:inline}
  .entete #sortir{padding:0 12px; min-height:44px; display:inline-flex; align-items:center}

  .onglets{width:100%}
  .onglets .onglet{
    flex:1 1 0; min-width:0; padding:7px 4px;
    display:flex; flex-direction:column; align-items:center;
    font-size:14px; line-height:1.3;
  }
  .onglets .onglet .nb{margin-left:0; font-size:13px}

  /* L'en-tête d'une fiche : l'étoile rejoint le nom, en haut à droite, et les
     actions forment une grille de deux colonnes sous les puces. Mélangés aux
     puces, les boutons s'éparpillaient sur trois lignes et « Supprimer » finissait
     seul sur la sienne. */
  .femme{position:relative}
  .femme-tete .nom{padding-right:52px}
  .femme-tete .etoile{position:absolute; top:10px; right:10px; margin:0}
  /* la dominante colorimétrique et le nom de dossier servent à l'atelier, pas
     au choix d'une photo à poster : sur téléphone ils cèdent la place */
  .puce.technique{display:none}
  /* align-items:stretch : sous 340 px « Tout télécharger » passe sur deux lignes,
     et sa voisine doit prendre la même hauteur plutôt que de flotter au milieu */
  .femme-actions{width:100%; display:grid; grid-template-columns:1fr 1fr; gap:8px; align-items:stretch}
  .femme-actions .bouton{
    width:100%; min-height:46px; padding-inline:8px; line-height:1.25;
    display:flex; align-items:center; justify-content:center;
  }
}

/* ---- tres petits ecrans ---- */
@media (max-width: 380px){
  .vue{flex-basis:84vw}
  .entete h1{font-size:17px}
}

/* ---- au doigt : cibles d'au moins 44 px ---- */
@media (pointer: coarse){
  .bouton{padding:13px 18px}
  .bouton.minuscule{padding:11px 12px; font-size:15px}
  .onglet{padding:11px 16px}
  select, input[type="text"], input[type="number"], input[type="search"]{padding:13px}
  /* deux boutons cote a cote deviennent illisibles sous 360 px de carte */
  .vue-actions{flex-wrap:wrap}
  .vue-actions > *{min-width:calc(50% - 4px)}
  /* l'etoile tient dans un carre de 44 px, comme toute autre cible */
  .bouton.etoile{min-width:44px; min-height:44px; font-size:19px}
}

/* ---- sans survol (iPad, telephone) ----
   La fleche de regeneration n'apparaissait franchement qu'au survol de la
   photo : au doigt, il n'y a pas de survol, et elle restait a 35 % d'opacite
   sur l'image — invisible sur une photo claire. Ici elle est toujours la, et
   a la taille d'un doigt. */
@media (hover: none){
  .refaire{opacity:.92; width:44px; height:44px; font-size:21px; top:6px; right:6px}
}

/* ---- ecran tres bas (telephone en paysage) ---- */
@media (max-height: 480px) and (orientation: landscape){
  .entete{position:static}
}
</style>
</head>
<body>

<header class="entete">
  <h1>Atelier carrousels</h1>
  <span class="solde" id="solde" title="Crédit fal restant">…</span>
  <span class="note" id="compte"></span>
  <button class="bouton minuscule" id="sortir" style="margin-left:auto" title="Se déconnecter"><span class="sortir-long">Se déconnecter</span><span class="sortir-court">Sortir</span></button>
</header>

<main>

<div class="annonce" id="annonce" role="status" aria-live="polite" hidden></div>

<script>
const $ = s => document.querySelector(s);
let FEMMES = [], ONGLET = 'actives';
// les favoris sont une categorie a part : ils melangent a poster et archivees,
// donc l'onglet ne se resume plus a un booleen « archives ou non »
const REQUETE = {actives:'', favoris:'?favoris=1', archives:'?archives=1'};
const VIDE = {
  actives:'Aucune femme à poster. Génère-en une ci-dessus.',
  favoris:'Aucun favori. Clique sur l’étoile d’une femme pour la mettre ici.',
  archives:'Aucune femme archivée.',
};
let LOT = 5;                       // photos ajoutees par le bouton « plus de photos »
const PAR_PAGE = 6;
let affichees = PAR_PAGE;
// nom -> {texte, rate} : l'avancement de l'ajout de photos survit au
// redessin de la liste, et reste affiche apres coup comme recu de l'operation
const EXT = {};

const echappe = t => String(t ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ------------------------------------------------------- adresses des images
// En local, le serveur sert lui-même vignettes et photos. En ligne, la
// bibliothèque fournit des URL signées du stockage, servies par son CDN à
// Paris ; ces chemins-ci ne servent qu'en repli (faire_web.py les adapte).
const REPLI_VIGNETTE = (nom, n) => `/api/media?nom=${nom}&n=${n}`;
const REPLI_PLEINE = (nom, n) => `/api/media?nom=${nom}&n=${n}&plein=1`;
// Une URL signée vaut deux heures ; passé ce délai-ci, on ne s'y fie plus.
const FRAIS = 100 * 60e3;
// Une vignette garde la même adresse d'un rechargement à l'autre : les URL
// signées changent à chaque lecture de la bibliothèque, et le navigateur
// retéléchargeait toutes les images après chaque action.
const ADRESSES = new Map();            // "nom/n" -> {url, t}
function vignetteDe(f, n){
  const cle = `${f.nom}/${n}`, m = ADRESSES.get(cle);
  if(m && Date.now() - m.t < FRAIS) return m.url;
  const signee = f.vignettes && f.vignettes[n], t = f._lu || Date.now();
  const url = signee && Date.now() - t < FRAIS ? signee : REPLI_VIGNETTE(f.nom, n);
  ADRESSES.set(cle, {url, t});
  return url;
}
// ?download= : le stockage répond « pièce jointe » — un clic télécharge la
// photo au lieu de l'ouvrir, sous le bon nom de fichier.
function pleineDe(f, n){
  const signee = f.pleines && f.pleines[n];
  if(!signee || Date.now() - (f._lu || 0) >= FRAIS) return REPLI_PLEINE(f.nom, n);
  return `${signee}&download=${encodeURIComponent(`${f.nom}_${n}.jpg`)}`;
}

// ------------------------------------------------------------------ annonces
let minuteurAnnonce = null;
function annoncer(texte, erreur = false){
  const z = $('#annonce');
  z.textContent = texte;
  z.classList.toggle('erreur', erreur);
  z.hidden = false;
  clearTimeout(minuteurAnnonce);
  minuteurAnnonce = setTimeout(() => z.hidden = true, erreur ? 6000 : 3500);
}

function vue(f, n){
  // Les cinq textes reprennent en boucle au-delà de la cinquième photo : une
  // personne n'a qu'une identité, et un second lot de cinq se poste tel quel.
  // Lus à l'indice n-1 seulement, les photos 6 et suivantes n'avaient pas de
  // légende, et « Copier le texte » copiait une chaîne vide.
  const t = f.textes || [];
  const txt = t.length ? t[(n - 1) % t.length] : '';
  return `<div class="vue" id="vue-${f.nom}-${n}">
    <div class="cadre">
      <img src="${vignetteDe(f, n)}" alt="Photo ${n} de ${echappe(f.prenom)}" loading="lazy" decoding="async">
      <button class="refaire" data-refaire="${f.nom}" data-numero="${n}"
        ${f.extensible ? '' : 'disabled'}
        title="${f.extensible
          ? `Regénérer cette photo — même personne, même décor, autre pose. Environ 0,05 $`
          : 'Carrousel trop ancien : sa fiche ne contient pas la description du visage'}"
        aria-label="Regénérer la photo ${n}">↻</button>
    </div>
    <div class="legende">${echappe(txt)}</div>
    ${NOTES_VUE.has(`${f.nom}-${n}`) ? `<div class="vue-note">${echappe(NOTES_VUE.get(`${f.nom}-${n}`))}</div>` : ''}
    <div class="vue-actions">
      <a class="bouton telecharge minuscule" href="${pleineDe(f, n)}" download="${f.nom}_${n}.jpg"
        data-photo="${f.nom}_${n}.jpg" data-repli="${REPLI_PLEINE(f.nom, n)}">Télécharger</a>
      <button class="bouton minuscule" data-copie="${echappe(txt)}">Copier le texte</button>
    </div>
  </div>`;
}

function carte(f){
  const vues = f.photos.map(p => vue(f, parseInt(p))).join('');
  return `<article class="femme">
    <div class="femme-tete">
      <span class="nom">${echappe(f.prenom || f.nom)}, ${f.age} ans</span>
      <span class="puce genre">${f.genre === 'h' ? 'Homme' : 'Femme'}</span>
      <span class="puce">${echappe(f.metier || '—')}</span>
      <span class="puce">${echappe(f.recherche || '—')}</span>
      <span class="puce technique">${echappe(f.persona || '—')}</span>
      <span class="puce technique">${echappe(f.nom)}</span>
      ${f.retro ? '<span class="puce reconstitue">texte reconstitué</span>' : ''}
      ${f.archivee && ONGLET === 'favoris' ? '<span class="puce">archivée</span>' : ''}
      <button class="bouton etoile minuscule${f.favori ? ' aimee' : ''}"
        data-favori="${f.nom}" data-aimee="${f.favori ? 1 : 0}"
        title="${f.favori ? 'Retirer des favoris' : 'Mettre en favori'}"
        aria-label="${f.favori ? 'Retirer des favoris' : 'Mettre en favori'}">${f.favori ? '★' : '☆'}</button>
      <div class="femme-actions">
        <button class="bouton plus minuscule" data-plus="${f.nom}"
          data-qui="${echappe(f.prenom || f.nom)}" ${f.extensible ? '' : 'disabled'}
          title="${f.extensible
            ? `${LOT} photos de plus de la même personne, environ ${(LOT * 0.045).toFixed(2).replace('.', ',')} $`
            : 'Carrousel trop ancien : sa fiche ne contient pas la description du visage'}"
          >+ ${LOT} photos</button>
        <a class="bouton telecharge minuscule" href="/api/archive?nom=${f.nom}" data-tout="${f.nom}">Tout télécharger</a>
        <button class="bouton archive minuscule" data-archive="${f.nom}" data-archivee="${f.archivee ? 1 : 0}">${f.archivee ? 'Restaurer' : 'Archiver'}</button>
        <button class="bouton supprime minuscule" data-supprime="${f.nom}" data-qui="${echappe(f.prenom || f.nom)}">Supprimer</button>
      </div>
    </div>
    <div class="extension${(EXT[f.nom] || {}).rate ? ' rate' : ''}" id="ext-${f.nom}"
      ${EXT[f.nom] ? '' : 'hidden'}>${echappe((EXT[f.nom] || {}).texte || '')}</div>
    <div class="pellicule">${vues}</div>
  </article>`;
}

function rendre(){
  const q = $('#filtre').value.trim().toLowerCase();
  const l = q ? FEMMES.filter(f =>
    [f.prenom, f.metier, f.recherche, f.nom, String(f.age)].join(' ').toLowerCase().includes(q)) : FEMMES;
  const vus = l.slice(0, affichees);
  $('#librairie').innerHTML = vus.length
    ? vus.map(carte).join('') + (l.length > vus.length
        ? `<button class="bouton" id="plus" style="width:100%">Afficher les ${Math.min(PAR_PAGE, l.length - vus.length)} suivantes (${l.length - vus.length} restantes)</button>`
        : '')
    : `<div class="vide">${VIDE[ONGLET]}</div>`;
  const b = $('#plus');
  if(b) b.onclick = () => { affichees += PAR_PAGE; rendre(); };
  $('#filtreNote').textContent = q
    ? `${l.length} sur ${FEMMES.length}`
    : (l.length > vus.length ? `${vus.length} affichées sur ${l.length}` : '');
}

async function solde(){
  const e = $('#solde');
  try{
    const r = await fetch('/api/solde');
    if(r.status === 401) return;
    const d = await r.json();
    if(typeof d.solde !== 'number'){ e.textContent = '— $'; e.className = 'solde hs'; return; }
    e.textContent = d.solde.toFixed(2).replace('.', ',') + ' $';
    // ~0,21 $ le carrousel : en dessous de 1 $ il en reste moins de cinq
    e.className = 'solde' + (d.solde < 0.25 ? ' vide' : d.solde < 1 ? ' bas' : '');
    e.title = `Crédit fal restant — environ ${Math.floor(d.solde / 0.21)} carrousels`;
  }catch(err){
    e.textContent = '— $'; e.className = 'solde hs';
  }
}
setInterval(solde, 60000);

const libelle = (texte, nb) => `${texte}<span class="nb">${nb}</span>`;

// Une fonction en panne répond souvent par une page HTML : on n'en garde que le
// texte, sinon le message d'erreur affiche « <!DOCTYPE HTML><html… ».
const sansBalises = t => String(t).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 140);

// ------------------------------------------------------------ bibliothèque
// Chaque onglet est gardé en mémoire : on y revient instantanément, et sa
// version à jour arrive en arrière-plan. Les deux autres onglets sont lus dès
// le premier affichage, pour que le premier passage soit instantané aussi.
const MEMO = {};                       // onglet -> fiches
let COMPTES = null;                    // {actives, favoris, archives}
let PERSONAS = [], derniereLecture = 0;
// Chaque action compte : une lecture partie avant elle rendrait la liste
// d'avant, et ferait réapparaître la fiche qu'on vient de supprimer.
let ACTIONS = 0;

function afficherComptes(){
  const c = COMPTES;
  if(!c) return;
  $('#compte').textContent = `${c.actives} à poster · ${c.favoris} favori${c.favoris > 1 ? 's' : ''} · ${c.archives} archivée${c.archives > 1 ? 's' : ''}`;
  $('#ongActives').innerHTML = libelle('À poster', c.actives);
  $('#ongFavoris').innerHTML = libelle('Favoris', c.favoris);
  $('#ongArchives').innerHTML = libelle('Archivées', c.archives);
}

function remplirPersonas(){
  const sel = $('#persona');
  if(!sel.options.length) PERSONAS.forEach(p => sel.add(new Option(p.replace(/_/g,' '), p)));
}

// Lit un onglet et le range en mémoire. Rend false si une action a eu lieu
// pendant la lecture : sa réponse est périmée, on l'ignore.
async function lire(quel){
  const avant = ACTIONS;
  const r = await fetch('/api/librairie' + REQUETE[quel]);
  if(r.status === 401){ location.reload(); return new Promise(() => {}); }
  // la réponse n'est pas toujours du JSON : une fonction qui plante renvoie du HTML
  const brut = await r.text();
  let d = {};
  try{ d = JSON.parse(brut); }catch(e){}
  if(!r.ok || !Array.isArray(d.femmes)) throw new Error(d.erreur || `${r.status} ${sansBalises(brut)}`);
  if(avant !== ACTIONS) return false;
  const t = Date.now();
  d.femmes.forEach(f => f._lu = t);          // l'âge de ses adresses signées
  MEMO[quel] = d.femmes;
  COMPTES = {actives: d.nb_actives, favoris: d.nb_favoris, archives: d.nb_archivees};
  LOT = d.lot || LOT;
  PERSONAS = d.personas || PERSONAS;
  remplirPersonas();
  derniereLecture = t;
  memoriser();
  return true;
}

async function charger(){
  const quel = ONGLET;
  try{
    if(!await lire(quel) || quel !== ONGLET) return;
    FEMMES = MEMO[quel];
    afficherComptes();
    rendre();
  }catch(err){
    // Une liste déjà affichée vaut mieux qu'un écran d'erreur : on la garde.
    if(quel !== ONGLET || MEMO[quel]) return;
    // Sans ce garde-fou, la moindre panne laissait « Chargement… » à l'écran
    // indéfiniment, sans dire ce qui n'allait pas (base en pause, réseau du
    // téléphone qui décroche). Il avait été ajouté à la main dans web/app.html,
    // et une régénération par faire_web.py l'avait effacé : il vit désormais ici.
    $('#librairie').innerHTML = `<div class="vide">Bibliothèque injoignable.
      <div style="margin-top:8px;font-size:14px;opacity:.7">${echappe(String(err.message || err))}</div>
      <button class="bouton" id="reessayer" style="margin-top:14px">Réessayer</button></div>`;
    $('#reessayer').onclick = charger;
  }
}

// Après le premier affichage : les autres onglets, en arrière-plan.
function prechargerOnglets(){
  for(const o of Object.keys(REQUETE)) if(o !== ONGLET && !MEMO[o]) lire(o).catch(() => {});
}

// Tout relire : l'onglet affiché, et les autres en arrière-plan.
function relire(){
  charger();
  for(const o of Object.keys(REQUETE)) if(o !== ONGLET) lire(o).catch(() => {});
}

// La bibliothèque est aussi gardée sur l'appareil : à la réouverture de l'app,
// elle s'affiche aussitôt, et la version à jour la remplace dès qu'elle arrive.
// Pas au-delà de FRAIS : ses adresses d'images auraient expiré.
const INSTANTANE = 'atelier-bibliotheque';
function memoriser(){
  try{
    localStorage.setItem(INSTANTANE, JSON.stringify({t: Date.now(), memo: MEMO, comptes: COMPTES,
                                                     lot: LOT, personas: PERSONAS}));
  }catch(err){}
}
function reprendre(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(INSTANTANE) || 'null'); }catch(err){}
  if(!s || !s.memo || Date.now() - s.t > FRAIS) return;
  Object.assign(MEMO, s.memo);
  COMPTES = s.comptes;
  LOT = s.lot || LOT;
  PERSONAS = s.personas || [];
  remplirPersonas();
  afficherComptes();
  if(MEMO[ONGLET]){ FEMMES = MEMO[ONGLET]; rendre(); }
}

// Les adresses signées expirent : une page restée ouverte relit la
// bibliothèque de temps en temps, et en revenant au premier plan.
setInterval(() => { if(document.visibilityState === 'visible') relire(); }, 20 * 60e3);
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && Date.now() - derniereLecture > 5 * 60e3) relire();
});

function onglet(quel){
  ONGLET = quel;
  affichees = PAR_PAGE;
  $('#ongActives').classList.toggle('actif', quel === 'actives');
  $('#ongFavoris').classList.toggle('actif', quel === 'favoris');
  $('#ongArchives').classList.toggle('actif', quel === 'archives');
  // la version en mémoire tout de suite, la version à jour ensuite
  if(MEMO[quel]){ FEMMES = MEMO[quel]; rendre(); }
  else $('#librairie').innerHTML = '<div class="vide">Chargement…</div>';
  charger();
}
$('#ongActives').onclick = () => onglet('actives');
$('#ongFavoris').onclick = () => onglet('favoris');
$('#ongArchives').onclick = () => onglet('archives');

$('#filtre').addEventListener('input', () => { affichees = PAR_PAGE; rendre(); });

// ------------------------------------------- actions : tout de suite à l'écran
// Archiver, restaurer, supprimer, (dé)favoriser s'affichent immédiatement : on
// n'attend plus la réponse du serveur, qui figeait le bouton une à deux
// secondes. La requête part en arrière-plan, dans l'ordre des gestes pour une
// même fiche ; si elle échoue, un message le dit, et la bibliothèque est relue
// telle que le serveur la connaît.

// En local, une route par action ; en ligne, une seule fonction (/api/action) :
// faire_web.py remplace ce corps.
function envoyerAction(nom, quoi){
  return fetch('/api/action', {method:'POST', headers:{'Content-Type':'application/json'},
                               body: JSON.stringify({nom, action: quoi})});
}

// l'ordre de la bibliothèque : de la plus récente à la plus ancienne
const inserer = (liste, f) => [...liste, f].sort((x, y) => String(y.cree || '').localeCompare(String(x.cree || '')));

// La même action appliquée à la liste en mémoire d'un onglet.
function appliquer(liste, onglet, f, quoi){
  const sans = () => liste.filter(x => x.nom !== f.nom);
  const avec = champs => liste.some(x => x.nom === f.nom)
    ? liste.map(x => x.nom === f.nom ? {...x, ...champs} : x) : null;
  if(quoi === 'supprimer') return sans();
  if(quoi === 'archiver' || quoi === 'restaurer'){
    const archivee = quoi === 'archiver';
    if(onglet === 'favoris') return avec({archivee}) || liste;
    if(onglet === (archivee ? 'actives' : 'archives')) return sans();
    return avec({archivee}) || inserer(liste, {...f, archivee});
  }
  const favori = quoi === 'favori';
  if(onglet === 'favoris') return favori ? (avec({favori}) || inserer(liste, {...f, favori})) : sans();
  return avec({favori}) || liste;
}

function compter(f, quoi){
  const c = COMPTES;
  if(!c) return;
  if(quoi === 'supprimer'){ c[f.archivee ? 'archives' : 'actives']--; if(f.favori) c.favoris--; }
  else if(quoi === 'archiver'){ c.actives--; c.archives++; }
  else if(quoi === 'restaurer'){ c.archives--; c.actives++; }
  else c.favoris += quoi === 'favori' ? 1 : -1;
}

const ECHEC = {supprimer:'Suppression refusée', archiver:'Archivage refusé', restaurer:'Restauration refusée',
               favori:'Favori refusé', defavori:'Favori refusé'};
const FILES = {};                      // nom -> dernière requête : l'ordre des gestes
let EN_VOL = 0, relecture = null;

function agir(nom, quoi){
  const f = FEMMES.find(x => x.nom === nom);
  if(!f) return;
  ACTIONS++;
  compter(f, quoi);
  for(const o of Object.keys(MEMO)) MEMO[o] = appliquer(MEMO[o], o, f, quoi);
  FEMMES = MEMO[ONGLET] || appliquer(FEMMES, ONGLET, f, quoi);
  afficherComptes();
  rendre();
  memoriser();

  EN_VOL++;
  FILES[nom] = (FILES[nom] || Promise.resolve()).then(async () => {
    let echec = null;
    try{
      const r = await envoyerAction(nom, quoi);
      const d = await r.json().catch(() => ({}));
      if(!r.ok || d.erreur) echec = d.erreur || `erreur ${r.status}`;
    }catch(err){
      echec = 'réseau injoignable';
    }
    if(echec) annoncer(`${ECHEC[quoi]} pour ${f.prenom || nom} : ${echec}`, true);
    // Plus rien en route : on relit ce que le serveur sait. Sans effet visible
    // si tout est passé ; c'est ce qui annule à l'écran ce qui a échoué.
    if(--EN_VOL === 0){
      clearTimeout(relecture);
      relecture = setTimeout(relire, echec ? 0 : 400);
    }
  });
}

document.addEventListener('click', async e => {
  const sup = e.target.closest('[data-supprime]');
  if(sup){
    if(!confirm(`Supprimer le carrousel de ${sup.dataset.qui} ?

Le carrousel passe en corbeille : il disparaît des deux onglets mais les photos restent en ligne.`)) return;
    agir(sup.dataset.supprime, 'supprimer');
    return;
  }
  const a = e.target.closest('[data-archive]');
  if(a){
    // l'etat vient du bouton, pas de l'onglet : dans « Favoris » les deux se cotoient
    agir(a.dataset.archive, a.dataset.archivee === '1' ? 'restaurer' : 'archiver');
    return;
  }
  const fav = e.target.closest('[data-favori]');
  if(fav){
    agir(fav.dataset.favori, fav.dataset.aimee === '1' ? 'defavori' : 'favori');
    return;
  }
  const plus = e.target.closest('[data-plus]');
  if(plus){ etendre(plus); return; }
  const rf = e.target.closest('[data-refaire]');
  if(rf){ refaireUne(rf); return; }
  const b = e.target.closest('[data-copie]');
  if(!b) return;
  // le libellé d'origine est gardé à part : deux touchers rapprochés
  // relisaient « Copié » comme libellé, et le bouton restait bloqué dessus
  if(!b.dataset.libelle) b.dataset.libelle = b.textContent;
  const annoncer = (t, ms) => { b.textContent = t; setTimeout(() => b.textContent = b.dataset.libelle, ms); };
  copier(b.dataset.copie).then(() => annoncer('Copié', 1200), () => annoncer('Copie impossible', 2000));
});

// Le presse-papiers moderne n'existe que sur une page sécurisée, et Safari le
// refuse parfois hors du geste qui l'a demandé. Le repli par zone de texte
// sélectionnée marche partout — à condition, sur iOS, de fixer la sélection
// par setSelectionRange : select() seul n'y sélectionne rien.
function copier(texte){
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(texte).catch(() => copierALAncienne(texte));
  }
  return copierALAncienne(texte);
}

function copierALAncienne(texte){
  return new Promise((ok, ko) => {
    const t = document.createElement('textarea');
    t.value = texte;
    t.setAttribute('readonly', '');
    t.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
    document.body.appendChild(t);
    t.select();
    t.setSelectionRange(0, texte.length);
    let reussi = false;
    try{ reussi = document.execCommand('copy'); }catch(err){}
    t.remove();
    reussi ? ok() : ko(new Error('copie refusée'));
  });
}

// ------------------------------------------------ enregistrer dans la galerie
// Trois appareils, trois chemins :
// - iPhone et iPad : un lien de téléchargement y range la photo dans l'app
//   Fichiers, d'où il faut aller la rechercher à la main. La feuille de partage
//   propose, elle, « Enregistrer l'image » (ou « Enregistrer 5 images »), qui la
//   range dans Photos : c'est le seul chemin vers la pellicule qu'une page ait.
// - Android : c'est l'inverse. La feuille de partage n'y propose que des applis
//   (WhatsApp, Drive…), jamais la galerie : les photos n'arrivaient nulle part.
//   Un vrai téléchargement du JPEG, lui, arrive dans « Download », que la galerie
//   et le sélecteur de photos de TikTok montrent aussitôt. « Tout télécharger »
//   y envoie chaque photo plutôt qu'un zip, qu'aucune galerie n'ouvre.
// - À la souris : le lien garde son comportement ordinaire (la photo, ou le zip).
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);   // l'iPad se présente en Mac
const PARTAGE = IOS && !!navigator.canShare && (() => {
  try{ return navigator.canShare({files: [new File([new Blob()], 'x.jpg', {type: 'image/jpeg'})]}); }
  catch(err){ return false; }
})();
const DIRECT = !IOS && matchMedia('(pointer: coarse)').matches;

// Les photos d'un lien : la sienne, ou toutes celles de la fiche.
function photosDe(lien){
  const liens = lien.dataset.tout ? [...lien.closest('.femme').querySelectorAll('a[data-photo]')] : [lien];
  return liens.map(a => ({url: a.href, repli: a.dataset.repli, nom: a.dataset.photo}));
}

// Chaque photo depuis le stockage ; si son adresse signée a expiré, par la
// fonction qui la sert, plus lente mais toujours valable.
function recuperer(photos){
  return Promise.all(photos.map(async p => {
    let r = await fetch(p.url).catch(() => null);
    if((!r || !r.ok) && p.repli) r = await fetch(p.repli);
    if(!r || !r.ok) throw new Error(r ? `erreur ${r.status}` : 'réseau injoignable');
    return new File([await r.blob()], p.nom, {type: 'image/jpeg'});
  }));
}

// Le téléchargement commence dès que le doigt touche le bouton, pas quand il
// se relève : une ou deux centaines de millisecondes de gagnées.
const AVANCE = new WeakMap();
document.addEventListener('pointerdown', e => {
  if(!PARTAGE && !DIRECT) return;
  const lien = e.target.closest('a[data-photo], a[data-tout]');
  if(!lien || AVANCE.has(lien) || lien.classList.contains('travaille')) return;
  const promesse = recuperer(photosDe(lien));
  promesse.catch(() => {});
  AVANCE.set(lien, promesse);
}, {passive: true});

function fichiersDe(lien){
  const promesse = AVANCE.get(lien) || recuperer(photosDe(lien));
  AVANCE.delete(lien);
  return promesse;
}

// Android : chaque photo devient un vrai téléchargement.
async function versGalerie(lien){
  if(lien.classList.contains('travaille')) return;
  lien.classList.add('travaille');
  try{
    const fichiers = await fichiersDe(lien);
    for(let i = 0; i < fichiers.length; i++){
      // Chrome laisse tomber des téléchargements lancés trop serrés
      if(i) await new Promise(ok => setTimeout(ok, 250));
      const a = document.createElement('a');
      a.href = URL.createObjectURL(fichiers[i]);
      a.download = fichiers[i].name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    }
    annoncer(fichiers.length > 1
      ? `${fichiers.length} photos téléchargées — galerie, album Download`
      : 'Photo téléchargée — galerie, album Download');
  }catch(err){
    annoncer('Téléchargement impossible : ' + (err.message || err), true);
  }finally{
    lien.classList.remove('travaille');
  }
}

// iPhone et iPad. Safari n'accepte de partager que dans la foulée d'un geste :
// si les photos ont mis trop longtemps à arriver, il refuse (NotAllowedError).
// On garde alors les fichiers prêts, et le bouton demande un second toucher,
// qui partage tout de suite, sans rien attendre.
const PRETS = new WeakMap();

async function versPellicule(lien){
  const prets = PRETS.get(lien);
  if(prets){
    PRETS.delete(lien);
    lien.textContent = lien.dataset.libelle;
    return navigator.share({files: prets}).catch(() => {});
  }
  if(lien.classList.contains('travaille')) return;
  lien.classList.add('travaille');
  let fichiers;
  try{
    fichiers = await fichiersDe(lien);
  }catch(err){
    lien.classList.remove('travaille');
    location.href = lien.href;          // le téléchargement ordinaire, en dernier recours
    return;
  }
  lien.classList.remove('travaille');
  try{
    await navigator.share({files: fichiers});
  }catch(err){
    if(err.name === 'NotAllowedError'){
      PRETS.set(lien, fichiers);
      lien.dataset.libelle = lien.textContent;
      lien.textContent = 'Toucher pour enregistrer';
    }
    // AbortError : la feuille a été refermée sans rien choisir, il n'y a rien à faire
  }
}

// En phase de capture, pour passer avant le comportement par défaut du lien.
document.addEventListener('click', e => {
  if(!PARTAGE && !DIRECT) return;
  const lien = e.target.closest('a[data-photo], a[data-tout]');
  if(!lien) return;
  e.preventDefault();
  (PARTAGE ? versPellicule : versGalerie)(lien);
}, true);

// ------------------------------------------- refaire une photo en particulier
// Pas de confirmation : la flèche est petite, posée sur la photo concernée, et
// l'opération coûte cinq centimes. C'est un geste de retouche, pas un achat.
function etatVue(nom, n, classe){
  const v = document.getElementById(`vue-${nom}-${n}`);
  if(!v) return null;
  v.classList.remove('occupee', 'ratee');
  if(classe) v.classList.add(classe);
  return v;
}

function rafraichir(nom, n){
  // la vignette a changé sur le disque mais garde son adresse : sans ce
  // paramètre le navigateur resservirait celle qu'il a en cache
  const v = document.getElementById(`vue-${nom}-${n}`);
  const img = v && v.querySelector('img');
  if(!img) return;
  const u = img.src.split('#')[0];
  img.src = u + (u.includes('?') ? '&' : '?') + 'r=' + Date.now();
  ADRESSES.set(`${nom}/${n}`, {url: img.src, t: Date.now()});   // et la garde aux redessins suivants
}

// L'échec d'une photo s'écrit sous CETTE photo. Écrit en haut de page, dans le
// formulaire « Nouveau profil », il restait invisible à qui venait de toucher la
// flèche, loin en bas de la bibliothèque. Gardé ici pour survivre au redessin.
const NOTES_VUE = new Map();           // "nom-numéro" -> message
function noteVue(nom, n, texte){
  const cle = `${nom}-${n}`;
  if(texte) NOTES_VUE.set(cle, texte); else NOTES_VUE.delete(cle);
  const v = document.getElementById(`vue-${cle}`);
  if(!v) return;
  let z = v.querySelector('.vue-note');
  if(!texte){ if(z) z.remove(); return; }
  if(!z){
    z = document.createElement('div');
    z.className = 'vue-note';
    v.querySelector('.legende').after(z);
  }
  z.textContent = texte;
}

async function refaireUne(bouton){
  const nom = bouton.dataset.refaire, n = bouton.dataset.numero;
  const v = document.getElementById(`vue-${nom}-${n}`);
  if(!v || v.classList.contains('occupee')) return;
  etatVue(nom, n, 'occupee');
  noteVue(nom, n, '');

  const r = await fetch('/api/generer', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({nom, numero: +n, refaire: true})
  });
  const {job, erreur} = await r.json();
  if(erreur || !job){
    etatVue(nom, n, 'ratee');
    noteVue(nom, n, erreur || 'La régénération n’a pas démarré.');
    return;
  }
  suivreGenerations();

  const t = setInterval(async () => {
    const j = await (await fetch('/api/job?id=' + job)).json();
    if(j.etat !== 'fini' && j.etat !== 'erreur') return;
    clearInterval(t);
    if(j.etat === 'erreur'){
      etatVue(nom, n, 'ratee');
      noteVue(nom, n, (j.erreur || 'La régénération a échoué.').split('\n')[0]);
      return;
    }
    ADRESSES.delete(`${nom}/${n}`);   // l'ancienne adresse resservirait l'ancienne image
    await charger();          // redessine la carte, puis on force l'image
    rafraichir(nom, n);
    solde();
  }, 1500);
}

// ------------------------------------ photos supplémentaires d'une personne
// L'avancement s'affiche dans la carte de la personne concernée, pas dans le
// journal du haut : on peut en lancer plusieurs et continuer à naviguer.
// Plusieurs lots peuvent tourner sur la même personne : le serveur réserve à
// chacun ses numéros (6-10, 11-15…). Le bouton ne se bloque que le temps du
// lancement ; la zone d'avancement de la carte suit le dernier lot lancé, et le
// panneau « Générations en cours » les montre tous.
const EXT_DERNIER = {};                // nom -> jeton du dernier lot lancé

async function etendre(bouton){
  const nom = bouton.dataset.plus, qui = bouton.dataset.qui;
  const prix = (LOT * 0.045).toFixed(2).replace('.', ',');
  if(!confirm(`Générer ${LOT} photos de plus de ${qui} ?

Même visage, nouveaux lieux, et les mêmes textes qui reprennent dans l'ordre : le lot se poste tel quel comme un second carrousel. Environ ${prix} $.`)) return;

  bouton.disabled = true;
  const moi = EXT_DERNIER[nom] = Symbol();
  const ecrire = (texte, rate) => {
    if(EXT_DERNIER[nom] !== moi) return;             // un lot plus récent a la main
    EXT[nom] = {texte, rate};
    const z = document.getElementById('ext-' + nom);   // re-cherche : la liste se redessine
    if(!z) return;
    z.hidden = false;
    z.classList.toggle('rate', !!rate);
    z.textContent = texte;
    z.scrollTop = 1e6;
  };
  ecrire('Démarrage…');

  let job, erreur;
  try{
    const r = await fetch('/api/generer', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({nom, combien: LOT, etendre: true})
    });
    ({job, erreur} = await r.json());
  }catch(err){
    erreur = 'La génération n’a pas démarré : ' + err;
  }
  bouton.disabled = false;             // on peut en relancer un autre aussitôt
  if(erreur || !job){
    ecrire(erreur || 'La génération n’a pas démarré.', true);
    return;
  }
  suivreGenerations();

  const t = setInterval(async () => {
    const j = await (await fetch('/api/job?id=' + job)).json();
    const fini = j.etat === 'fini' || j.etat === 'erreur';
    ecrire((j.lignes || []).join('\n') || 'Génération en cours…', j.etat === 'erreur');
    if(fini){
      clearInterval(t);
      if(j.etat === 'erreur') ecrire(j.erreur || 'Échec.', true);
      charger();
      solde();
    }
  }, 1500);
}

// ------------------------------------------------ générations en cours, partout
// La liste vient du serveur, pas de l'appareil qui a lancé : une génération
// lancée sur le téléphone apparaît sur l'iPad, avec son avancement, et chacun
// voit son issue. Plusieurs peuvent tourner ensemble : le bouton « Générer »
// ne se bloque plus, et le serveur tire prénom, poses et lieux sous verrou.
const VUES = new Map();                // id -> état au dernier passage
let prochaineLecture = null, premiereLecture = true;

// Chaque photo terminée laisse dans le journal une ligne « 3 [scène] … », et
// `total` dit combien il en faut. La photo en cours compte pour moitié : sans
// cela la barre resterait à zéro pendant toute la première.
function avancement(j){
  if(j.etat === 'fini') return 100;
  const total = j.total || 5;
  const faites = (j.lignes || []).filter(l => /^\s{2}\d+ \[/.test(l)).length;
  return Math.min(97, Math.round((Math.min(faites, total) + 0.5) / total * 100));
}

// le journal parle au développeur ; l'étape, à celle qui regarde
function etape(j){
  if(j.etat === 'fini') return 'Terminé';
  if(j.etat === 'erreur') return (j.erreur || 'Échec').split('\n')[0];
  const l = (j.lignes || []).map(x => x.trim()).filter(Boolean);
  if(!l.length) return 'Démarrage…';
  const d = l[l.length - 1];
  let m;
  if((m = d.match(/^(\d+) \[/))) return `Photo ${m[1]} terminée`;
  if((m = d.match(/^(\d+) recalée \((.*)\)/))) return `Photo ${m[1]} refaite : ${m[2]}`;
  if((m = d.match(/^contrôle (\d+)/))) return `Photo ${m[1]} contrôlée`;
  if(/^identité :/.test(d)) return 'Identité tirée, première photo en cours';
  if(/ photo\(s\) de plus, /.test(d)) return 'Première photo en cours';
  if((m = d.match(/on refait la photo (\d+)/))) return `Photo ${m[1]} en cours`;
  if(/^visage :/.test(d)) return 'Visage décrit';
  if(/televersees/.test(d)) return 'Enregistrement';
  return d.replace(/^=>\s*/, '');
}

// un nouveau profil ne connaît son prénom qu'une fois l'identité tirée
function titre(j){
  const id = (j.lignes || []).map(l => l.match(/identité : ([^,]+), (\d+) ans/)).find(Boolean);
  if(j.type === 'creation' && id) return `${id[1]}, ${id[2]} ans · nouveau profil`;
  return j.libelle || j.nom;
}

let dernierRendu = '';
function rendreGenerations(jobs){
  const actives = jobs.filter(j => j.etat === 'en cours').length;
  $('#enCours').hidden = !jobs.length;
  $('#enCours h2').textContent = actives ? 'Générations en cours' : 'Générations terminées';
  $('#enCoursNote').textContent = actives ? `${actives} en cours` : '';
  // le journal ouvert le reste d'un passage à l'autre
  const ouverts = new Set([...document.querySelectorAll('#enCoursListe details[open]')].map(d => d.dataset.id));
  const html = jobs.map(j => {
    const p = avancement(j), classe = j.etat === 'fini' ? 'fini' : j.etat === 'erreur' ? 'erreur' : '';
    return `<div class="gen ${classe}">
      <div class="gen-tete"><span class="gen-titre">${echappe(titre(j))}</span><span class="gen-pct">${p} %</span></div>
      <div class="barre-prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}"
        aria-label="Avancement"><span style="width:${p}%"></span></div>
      <div class="gen-etape">${echappe(etape(j))}</div>
      <details data-id="${echappe(j.id)}" ${ouverts.has(String(j.id)) ? 'open' : ''}>
        <summary>Journal</summary><pre>${echappe((j.lignes || []).join('\n'))}</pre>
      </details>
    </div>`;
  }).join('');
  // Rien de neuf : on ne touche pas à la page. Redessinée toutes les trois
  // secondes pour rien, elle remettait en haut le journal qu'on était en train de lire.
  if(html === dernierRendu) return;
  dernierRendu = html;
  $('#enCoursListe').innerHTML = html;
  document.querySelectorAll('#enCoursListe details[open] pre').forEach(p => p.scrollTop = p.scrollHeight);
}
// un journal qu'on ouvre montre d'abord ses dernières lignes
$('#enCoursListe').addEventListener('toggle', e => {
  const p = e.target.open && e.target.querySelector('pre');
  if(p) p.scrollTop = p.scrollHeight;
}, true);

async function suivreGenerations(){
  clearTimeout(prochaineLecture);
  let jobs = null;
  try{
    const r = await fetch('/api/job');
    if(r.ok) jobs = (await r.json()).jobs || [];
  }catch(err){}
  if(jobs){
    // Une génération qui vient d'aboutir — vue ici en cours, ou apparue déjà
    // finie parce que l'appareil dormait : la bibliothèque et le solde ont changé.
    let aRecharger = false;
    for(const j of jobs){
      const avant = VUES.get(j.id);
      if(j.etat === 'fini' && avant !== 'fini' && (avant === 'en cours' || !premiereLecture)) aRecharger = true;
      VUES.set(j.id, j.etat);
    }
    premiereLecture = false;
    rendreGenerations(jobs);
    if(aRecharger){ charger(); solde(); }
  }
  // plus vite quand quelque chose tourne ; rien du tout quand l'écran est caché
  if(document.visibilityState === 'visible'){
    const actives = (jobs || []).some(j => j.etat === 'en cours');
    prochaineLecture = setTimeout(suivreGenerations, actives ? 3000 : 12000);
  }
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') suivreGenerations();
  else clearTimeout(prochaineLecture);
});

$('#go').addEventListener('click', async () => {
  const go = $('#go');
  $('#erreur').textContent = '';
  go.classList.add('travaille'); go.disabled = true;
  try{
    const r = await fetch('/api/generer', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({age:+$('#age').value, persona:$('#persona').value, nom:$('#nom').value, genre:$('#genre').value})
    });
    const d = await r.json();
    if(d.erreur || !d.job){ $('#erreur').textContent = d.erreur || 'La génération n’a pas démarré.'; return; }
    $('#nom').value = '';
    await suivreGenerations();           // elle apparaît aussitôt dans « Générations en cours »
    $('#enCours').scrollIntoView({behavior:'smooth', block:'nearest'});
  }catch(err){
    $('#erreur').textContent = 'La génération n’a pas démarré : ' + err;
  }finally{
    // on peut en lancer une autre tout de suite : le bouton n'attend plus la fin
    go.classList.remove('travaille'); go.disabled = false;
  }
});

// --------------------------------------------------- carte de personnalite
async function chargerTypes(){
  const sel = $('#carteType');
  try{
    const r = await fetch('/api/carte?types=1');
    if(r.status === 401) return;        // session expirée : la bibliothèque recharge la page
    const brut = await r.text();
    let d = {};
    try{ d = JSON.parse(brut); }catch(e){}
    if(!r.ok || !Array.isArray(d.types)) throw new Error(d.erreur || `${r.status} ${sansBalises(brut)}`);
    d.types.forEach(t => sel.add(new Option(t.nom, t.id)));
  }catch(err){
    $('#carteErreur').textContent = 'Types de personnalité indisponibles : ' + (err.message || err);
  }
}

$('#carteGo').addEventListener('click', async () => {
  const go = $('#carteGo');
  $('#carteErreur').textContent = '';
  go.classList.add('travaille'); go.disabled = true;

  }finally{

  }
});

reprendre();                           // la dernière bibliothèque connue, aussitôt
charger().then(prechargerOnglets);
