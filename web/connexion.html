<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier carrousels</title>
<style>
:root{
  --fond:#0e0c11; --panneau:#191722; --panneau-2:#211e2c;
  --bord:#332f3f; --bord-vif:#463f55;
  --texte:#f0ecf2; --doux:#a9a2b4;
  --accent:#e5385f; --accent-clair:#ff6b8c; --erreur:#ff8a76;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
  background:radial-gradient(1400px 700px at 50% -18%, #241b23 0%, var(--fond) 62%);
  color:var(--texte);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.carte{
  width:min(420px,100%);
  background:var(--panneau); border:1px solid var(--bord); border-radius:16px;
  padding:32px 30px;
}
h1{margin:0 0 6px; font-size:21px; font-weight:800; letter-spacing:-.01em}
.note{color:var(--doux); font-size:15px; margin:0 0 24px}
label{
  display:block; font-size:14px; font-weight:700; letter-spacing:.05em;
  text-transform:uppercase; color:var(--doux); margin-bottom:8px;
}
input{
  width:100%; background:var(--panneau-2); color:var(--texte);
  border:1.5px solid var(--bord); border-radius:10px;
  padding:12px 14px; font:inherit; font-size:16px;
}
input:focus-visible,button:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-color:var(--accent);
}
button{
  width:100%; margin-top:16px;
  font:inherit; font-size:16px; font-weight:700;
  background:linear-gradient(180deg,var(--accent-clair),var(--accent));
  border:0; border-radius:10px; padding:12px 18px; color:#2b060f; cursor:pointer;
}
button:hover:not(:disabled){filter:brightness(1.08)}
button:disabled{opacity:.45; cursor:not-allowed}
#erreur{color:var(--erreur); font-size:15px; margin-top:14px; min-height:24px}
</style>
</head>
<body>
<form class="carte" id="f">
  <h1>Atelier carrousels</h1>
  <p class="note">Accès protégé.</p>
  <label for="mdp">Mot de passe</label>
  <input id="mdp" type="password" autocomplete="current-password" autofocus>
  <button type="submit" id="go">Entrer</button>
  <div id="erreur"></div>
</form>
<script>
const $ = s => document.querySelector(s);
$('#f').addEventListener('submit', async e => {
  e.preventDefault();
  $('#go').disabled = true;
  $('#erreur').textContent = '';
  try{
    const r = await fetch('/api/entrer', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({mdp: $('#mdp').value})
    });
    const d = await r.json();
    if(d.ok){ location.reload(); return; }
    $('#erreur').textContent = d.erreur || 'Mot de passe incorrect';
  }catch(err){
    $('#erreur').textContent = 'Serveur injoignable';
  }
  $('#go').disabled = false;
  $('#mdp').select();
});
</script>
</body>
</html>
